name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    # The version is in the name because it is the one fact about a run that
    # a reader wants without opening it.
    name: check (3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Sets UV_PYTHON. `requires-python` floors the version and would
          # resolve to this one anyway; naming it here is what makes a CI
          # run say which interpreter it used.
          python-version: "3.14"
      # The dictionary tests render a document with tbls and read the
      # result back. Pinned to the release tests/data/tbls.schema.json was
      # taken from, so the schema the tests validate against and the binary
      # they render with describe the same format.
      - uses: k1LoW/setup-tbls@f25e3d013a596865b2db90dac7ee19e9f15b5780 # v1.4.0
        with:
          version: v1.96.0
      - run: ./check.sh
