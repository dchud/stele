[project]
name = "stele"
version = "0.1.0"
description = "Introspect a mirrored SCD2 data model and generate portable SQLAlchemy ORM modules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.21",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sqlalchemy>=2.0.0",
]
mssql = [
    "pyodbc>=5.0",
]
all = [
    "databricks-sqlalchemy>=2.0.0",
    "pyodbc>=5.0",
]

[project.scripts]
stele = "stele.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stele"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.16.5",
    "types-PyYAML>=6.0",
    "zizmor>=1.29",
]

[tool.ruff]
line-length = 79
# Markdown code blocks are hand-laid-out for reading, not formatted.
extend-exclude = ["*.md"]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src", "tests", "scripts"]
mypy_path = "src:scripts"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
